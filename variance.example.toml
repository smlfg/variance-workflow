# variance-workflow config. Copy to your target repo as variance.toml and adjust.
# Paths are relative to this file.

[project]
repo = "."                 # target git repo
base = "HEAD"              # frozen at plan time to a SHA; every variant starts there
state_dir = ".vw"          # runs/, worktrees/ (add to .gitignore)

[feature]
name = "slugify"
spec = "features/slugify/SPEC.md"                 # relative to repo; injected into the prompt
# The ONLY paths a variant may write. {id} = variant id (a, b, c, ...).
# This is what makes variants coexist: each one owns its own directory.
owned = [
  "src/textkit/slugify/variants/v_{id}/",
  "tests/variants/test_v_{id}.py",
]
contract = """
Package `textkit.slugify.variants.v_{id}` exporting `slugify(text: str) -> str` and a `VARIANT` dict
with keys id, angle, model, summary.
"""
# Runs in each worktree with VW_VARIANT=<id> (and in the integration tree with VW_VARIANT=a,b,...).
acceptance_cmd = "PYTHONPATH=src python3 -m unittest discover -s tests/acceptance"
# Optional: prints a JSON object {input: output}; differing outputs become the behaviour table.
probe_cmd = "PYTHONPATH=src python3 -m textkit.slugify.probe features/slugify/probes.json"
setup_cmd = ""                                    # e.g. "uv sync -q"
integration_branch = "variants/slugify"

[runner]
harness = "opencode"       # adapters/<harness>.sh; can be overridden per model
max_concurrent = 6         # cross-process cap (flock slots)
slot_dir = "~/.cache/variance-workflow/slots"   # share with other tooling to share the cap
timeout_s = 2880           # 48 min per attempt; process group gets SIGTERM, then SIGKILL
retries = 1                # retry once on the same worktree/branch with the same prompt/model
stagger_s = 12             # min gap between starts (opencode "database is locked")
push = false               # the wrapper pushes variant branches; models never get credentials
remote = "origin"
author_name = "Samuel Fleig (via Agent)"
author_email = "186922365+smlfg@users.noreply.github.com"
pass_env = []              # env vars passed to the harness on purpose (secret-looking names are dropped otherwise)
# harness_env = { OPENCODE_BIN = "/home/box/.opencode/bin/opencode" }

# Model list. Variants are assigned round-robin: a -> first model, b -> second, ...
# Free OpenCode models (only usable inside OpenCode). Check with: opencode models opencode
[[models]]
id = "opencode/deepseek-v4.1-flash-free"
short = "deepseek"

[[models]]
id = "opencode/glm-5.3-flash-free"   # needs to be in the opencode provider whitelist, see README
short = "glm"

[[models]]
id = "opencode/mimo-v2.6-flash-free"
short = "mimo"

[[models]]
id = "opencode/nemotron-3-ultra-free"
short = "nemotron"

[[models]]
id = "opencode/muse-spark-1.3-contributor-free"
short = "muse"

# Another harness for one model (documented adapters: claude, codex, cursor-agent, aider):
# [[models]]
# id = "gpt-5.5"
# short = "codex"
# harness = "codex"

[variants]
count = 5
assign_angles = true
angles = [
  "locale-aware: transliterate per language (German ä->ae, ß->ss), readable ASCII",
  "unicode-first: keep letters of every script, never drop information",
  "minimal: the smallest correct implementation, no special cases",
  "user-facing: symbols become words, drop filler words, cut at word boundaries",
  "compatibility: mirror python-slugify's default behaviour as closely as stdlib allows",
]
# Full control instead of round-robin (overrides count/angles):
# explicit = [
#   { id = "a", model = "opencode/deepseek-v4.1-flash-free", angle = "minimal" },
#   { id = "b", model = "opencode/deepseek-v4.1-flash-free", angle = "robust" },  # same model, different angle
# ]

[prompts]
base = "prompts/base.md"          # defaults to the copies shipped with variance-workflow
diverge = "prompts/diverge.md"
learnings_file = "LEARNINGS.md"   # tail is injected into every prompt
learnings_lines = 40
